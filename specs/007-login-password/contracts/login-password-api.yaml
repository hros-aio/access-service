openapi: 3.0.3
info:
  title: Log In With Email and Password API
  description: Public authentication endpoint for logging in with email/password and handling multi-tenant IP restrictions, lockout, and MFA challenges.
  version: 1.0.0
servers:
  - url: /
    description: Default API base path
paths:
  /auth/login/password:
    post:
      summary: Authenticate user using email and password
      operationId: loginWithPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tenantCode
                - email
                - password
              properties:
                tenantCode:
                  type: string
                  example: TENANT_123
                  description: Scopes the user and settings to the correct tenant context.
                email:
                  type: string
                  format: email
                  example: employee@tenant.com
                  description: The user's primary login email address.
                password:
                  type: string
                  format: password
                  example: SecurePassword123!
                  description: The plaintext password credential.
                rememberMe:
                  type: boolean
                  default: false
                  example: true
                  description: Extends session TTL and issues a persistent refresh cookie if set to true.
      responses:
        '200':
          description: Successful authentication. Returns full access tokens OR an MFA challenge requirement.
          headers:
            Set-Cookie:
              description: >-
                Contains `__Host-refresh-token` cookie with HttpOnly, Secure,
                SameSite=Strict, and Path=/ attributes.
              schema:
                type: string
                example: '__Host-refresh-token=eyJ...; HttpOnly; Secure; SameSite=Strict; Path=/'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LoginSuccessResponse'
                  - $ref: '#/components/schemas/MfaChallengeResponse'
        '400':
          description: Validation error. Request payload fails structural validation rules.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Unauthorized. Invalid credentials, restricted IP, or locked/suspended account status. Returns a generic error to prevent account enumeration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorResponse'
        '429':
          description: Too many login attempts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitErrorResponse'
        '503':
          description: Session store/Redis is unavailable. Authentication fails closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableErrorResponse'
components:
  schemas:
    LoginSuccessResponse:
      type: object
      required:
        - authState
        - accessToken
      properties:
        authState:
          type: string
          enum: [AUTHENTICATED]
          example: AUTHENTICATED
        accessToken:
          type: string
          example: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9...
          description: Short-lived access JWT token.
    MfaChallengeResponse:
      type: object
      required:
        - authState
        - challengeId
      properties:
        authState:
          type: string
          enum: [MFA_REQUIRED]
          example: MFA_REQUIRED
        challengeId:
          type: string
          example: mfa_abc123xyz
          description: Transient verification challenge ID stored in Redis (valid for 5 minutes).
    ValidationErrorResponse:
      type: object
      required:
        - statusCode
        - message
        - error
      properties:
        statusCode:
          type: integer
          example: 400
        message:
          type: array
          items:
            type: string
          example: ["email must be an email", "password should not be empty"]
        error:
          type: string
          example: Bad Request
    UnauthorizedErrorResponse:
      type: object
      required:
        - statusCode
        - message
        - error
      properties:
        statusCode:
          type: integer
          example: 401
        message:
          type: string
          example: Invalid email or password.
        error:
          type: string
          example: Unauthorized
    RateLimitErrorResponse:
      type: object
      required:
        - statusCode
        - message
        - error
      properties:
        statusCode:
          type: integer
          example: 429
        message:
          type: string
          example: Too many login attempts. Please try again later.
        error:
          type: string
          example: Too Many Requests
    ServiceUnavailableErrorResponse:
      type: object
      required:
        - statusCode
        - message
        - error
      properties:
        statusCode:
          type: integer
          example: 503
        message:
          type: string
          example: Authentication store unavailable. Please try again later.
        error:
          type: string
          example: Service Unavailable
